stages:
  - deploy

deploy_production:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - test -n "$SSH_USER"
    - test -n "$SSH_HOST"
    - test -n "$DEPLOY_PATH"
    - test -n "$PM2_APP_NAME"
    - rsync -az --delete --exclude ".git" --exclude "node_modules" ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
    - |
      ssh "$SSH_USER@$SSH_HOST" \
        "DEPLOY_PATH='$DEPLOY_PATH' PM2_APP_NAME='$PM2_APP_NAME' bash -s" <<'REMOTE'
      set -euo pipefail

      cd "$DEPLOY_PATH"
      npm ci --omit=dev
      npm install -g pm2@latest
      pm2 update

      if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
        pm2 restart "$PM2_APP_NAME" --update-env
      else
        pm2 start npm --name "$PM2_APP_NAME" -- start
      fi

      pm2 save
REMOTE
