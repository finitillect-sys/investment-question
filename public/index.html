<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инвестиционный опросный лист</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="app-layout">

        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <span class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="13" width="4" height="8" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="10" y="8" width="4" height="13" rx="1.5" fill="currentColor" opacity="0.75"/><rect x="17" y="4" width="4" height="17" rx="1.5" fill="currentColor"/></svg></span>
                    <span class="logo-text">Данные проекта</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-group-label">Данные проекта</div>
                <button class="nav-btn active" data-section="A">
                    <span class="nav-letter">A</span>
                    <span>Общие данные</span>
                </button>
                <button class="nav-btn" data-section="B">
                    <span class="nav-letter">B</span>
                    <span>Средства производства</span>
                </button>
                <button class="nav-btn" data-section="E">
                    <span class="nav-letter">E</span>
                    <span>Продукты и услуги</span>
                </button>
                <div class="nav-group-label">Затраты</div>
                <button class="nav-btn" data-section="C1">
                    <span class="nav-letter">C1</span>
                    <span>Прямые затраты</span>
                </button>
                <button class="nav-btn" data-section="C2">
                    <span class="nav-letter">C2</span>
                    <span>Косвенные затраты</span>
                </button>
                <button class="nav-btn" data-section="D">
                    <span class="nav-letter">D</span>
                    <span>АХР</span>
                </button>
                <div class="nav-group-label">Финансы</div>
                <button class="nav-btn" data-section="F">
                    <span class="nav-letter">F</span>
                    <span>Персонал</span>
                </button>
                <button class="nav-btn" data-section="G">
                    <span class="nav-letter">G</span>
                    <span>Финансирование</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle" class="theme-btn"><svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Тёмная тема</button>
                <button id="resetBtn" class="btn-ghost-danger"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> Сбросить данные</button>
            </div>
        </aside>

        <main class="main-area">
            <div class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title" id="pageTitle">Общие данные о проекте</h1>
                </div>
                <div class="topbar-right">
                    <button id="exportCSVBtn" class="btn-secondary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="12" y2="18"/><line x1="15" y1="15" x2="12" y2="18"/></svg> Экспорт Excel</button>
                    <button id="calculateBtn" class="btn-primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Рассчитать проект</button>
                </div>
            </div>

            <div id="content" class="content-card"></div>

            <div id="results" class="results-section" style="display: none;">
                <div class="kpi-row" id="kpiRow"></div>

                <div class="chart-card">
                    <div class="chart-card-header">
                        <h3>Финансовый прогноз по годам</h3>
                        <div class="chart-legend" id="chartLegend"></div>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

                <div class="results-table-card">
                    <h3>Детальная таблица (<span id="curLabelDisplay">тыс. RUB</span>)</h3>
                    <div id="resultsContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/script.js"></script>
</body>
</html>
